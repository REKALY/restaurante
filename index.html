<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17201d" />
  <title>Kalytero — En construcción</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17201d;
      --cream: #f3eee5;
      --accent: #d66e31;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--ink);
      color: #fff;
      font-family: "DM Sans", sans-serif;
    }

    .coming-soon {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      width: 100%;
      display: grid;
      grid-template-rows: 1fr;
      overflow: hidden;
      background: linear-gradient(125deg, #17201d, #29463b 38%, #b85e2d 72%, #17201d);
      background-size: 300% 300%;
      animation: backgroundShift 16s ease-in-out infinite;
    }

    .coming-soon::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .topbar, .footer {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 30px clamp(24px, 5vw, 76px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 10px;
    }

    .brand {
      color: #fff;
      font-size: 18px;
      line-height: 1;
      letter-spacing: -.04em;
      text-transform: lowercase;
      font-weight: 700;
    }
    .brand span { color: var(--accent); }
    .status { display: flex; gap: 9px; align-items: center; color: rgba(255,255,255,.78); }
    .status i {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(214,110,49,.16);
    }

    .message-wrap {
      align-self: center;
      justify-self: center;
      width: min(68vw, 380px);
      display: grid;
      place-items: center;
      padding: 52px 42px;
      text-align: center;
      background: rgba(246, 241, 232, .91);
      color: var(--ink);
      box-shadow: 0 18px 45px rgba(0, 0, 0, .14);
      animation: appear .8s ease-out both;
    }
    .message-inner { width: 100%; }
    .eyebrow {
      margin: 0 0 20px;
      color: #69716d;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1;
      letter-spacing: -.055em;
      font-weight: 500;
    }
    .description {
      margin: 20px 0 0;
      color: #69716d;
      font-size: 14px;
      line-height: 1.5;
    }
    h1 em {
      display: block;
      color: var(--accent);
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 500;
      letter-spacing: -.06em;
    }
    .rule {
      width: 38px;
      height: 2px;
      margin: 23px auto 0;
      background: var(--accent);
    }
    .footer { color: rgba(255,255,255,.72); padding-top: 20px; }
    .footer p { margin: 0; }
    .footer p:last-child { color: rgba(255,255,255,.47); }

    @keyframes backgroundShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes appear { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    @media (max-width: 560px) {
      .topbar, .footer { padding: 24px; }
      .status { font-size: 9px; }
      .message-wrap { width: min(78vw, 320px); padding: 42px 28px; }
      .eyebrow { margin-bottom: 17px; font-size: 8px; }
      .footer p:last-child { display: none; }
    }
  </style>
</head>
<body>
  <main class="coming-soon">
    <section class="message-wrap" aria-label="Página en construcción">
      <div class="message-inner">
        <h1>Kalytero Restaurante</h1>
        <p class="description">Estamos actualizando nuestra página web. ¡Próximamente disponible!</p>
      </div>
    </section>

  </main>
</body>
</html>
